<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFFFF"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><style>:root{color-scheme:light dark}</style><title>영어로 말하자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: Duolingo-style vertical learning path + bottom tabs; one primary action per screen; chunky buttons. */
:root{
  --bg:#F3F5FB;--surface:#FFFFFF;--ink:#14203A;--mute:#66728C;--line:#E0E5F0;
  --brand:#2F6BFF;--brand-d:#1B4DD1;--brand-soft:#E7EEFF;
  --ok:#16B364;--ok-d:#0E8A4B;--ok-soft:#DCF6E8;
  --bad:#F04438;--bad-d:#C32D22;--bad-soft:#FFE5E2;
  --warn:#FFB020;--warn-soft:#FFF1D0;--flame:#FF7A1A;
  --u0:#2F6BFF;--u1:#7C5CFC;--u2:#16B364;--u3:#F59E0B;--u4:#EC4899;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1324;--surface:#172138;--ink:#EDF1FF;--mute:#97A3C0;--line:#27324F;
  --brand:#5B8CFF;--brand-d:#3A67DB;--brand-soft:#1D2C57;
  --ok:#2BD17E;--ok-d:#6EE9A8;--ok-soft:#12372A;
  --bad:#FF6B5E;--bad-d:#FF9A91;--bad-soft:#3B1C1D;
  --warn:#FFC24D;--warn-soft:#3A2F12;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1324;--surface:#172138;--ink:#EDF1FF;--mute:#97A3C0;--line:#27324F;
  --brand:#5B8CFF;--brand-d:#3A67DB;--brand-soft:#1D2C57;
  --ok:#2BD17E;--ok-d:#6EE9A8;--ok-soft:#12372A;
  --bad:#FF6B5E;--bad-d:#FF9A91;--bad-soft:#3B1C1D;
  --warn:#FFC24D;--warn-soft:#3A2F12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.ic{flex:none;vertical-align:middle}
#app{max-width:560px;margin:0 auto;padding-bottom:104px}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.pill.lv{color:var(--brand)}
.pill .fl{color:var(--flame)}.pill .bo{color:var(--warn)}
.pg-title{font-family:var(--display);font-size:26px;margin:6px 0 2px}
.sub{color:var(--mute);font-size:14px}

/* goal */
.goal{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;margin:4px 0 18px}
.goal .t{font-weight:800}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* path */
.unit{margin-top:22px}
.unit-h{background:var(--uc);color:#fff;border-radius:22px;padding:16px 18px;border-bottom:6px solid rgba(0,0,0,.2);display:flex;align-items:center;gap:12px}
.unit-h .k{font-size:12px;font-weight:800;opacity:.85;letter-spacing:.06em}
.unit-h .n{font-family:var(--display);font-size:22px;line-height:1.2}
.unit-h .m{font-size:13px;opacity:.9}
.unit-h .c{margin-left:auto;font-weight:800;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 4px}
.nd{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.nd .b{width:82px;height:82px;border-radius:50%;background:color-mix(in srgb,var(--uc) 22%,var(--surface));color:#fff;display:grid;place-items:center;border:4px solid var(--uc);border-bottom-width:9px;box-sizing:border-box;transition:transform .08s}
.nd:active .b{transform:translateY(3px);border-bottom-width:4px}
.nd.lock .b{background:var(--line);color:var(--mute);border-color:var(--line);border-bottom-color:rgba(0,0,0,.1);border-bottom-width:9px}
.nd.cur .b{box-shadow:0 0 0 8px color-mix(in srgb,var(--uc) 24%,transparent)}
.nd .b{position:relative}.nd .pic{display:grid;place-items:center;transition:opacity .2s}.nd.lock .pic{opacity:.85;filter:saturate(.75)}.nd .bd{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--mute);color:#fff;display:grid;place-items:center;border:3px solid var(--bg);font-style:normal}.nd .bd.ok{background:var(--ok)}
.nd .l{font-size:12.5px;font-weight:700;color:var(--mute)}
.nd.cur .l{color:var(--ink)}
.nd .go{position:absolute;top:-30px;background:var(--surface);color:var(--uc);font-weight:800;font-size:13px;border:2px solid var(--line);border-radius:12px;padding:3px 12px;animation:bob 1.4s ease-in-out infinite}
.nd .go::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.done-card{background:var(--ok-soft);border-radius:22px;padding:18px;margin-top:24px;text-align:center}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin:0 auto;display:flex;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--mute);font-size:11.5px;font-weight:700}
.tab.on{color:var(--brand)}
.tab.on .ic{stroke-width:2.6}
.tabs{box-shadow:0 -6px 18px rgba(20,32,58,.06);border-top:0;border-radius:22px 22px 0 0}
.tab{position:relative;gap:3px;padding:8px 0 7px;font-size:12px;font-weight:800;color:color-mix(in srgb,var(--tc) 55%,var(--mute));transition:color .15s}
.tab .ti{display:grid;place-items:center;width:52px;height:38px;border-radius:16px;background:transparent;transition:background .15s,transform .15s}
.tab .ti svg{opacity:.95;filter:none;transition:opacity .15s,transform .15s}
.tab.on{color:var(--tc)}
.tab.on .ti{background:color-mix(in srgb,var(--tc) 18%,var(--surface));transform:translateY(-2px);box-shadow:inset 0 0 0 2.5px var(--tc)}
.tab.on .ti svg{opacity:1;filter:none;transform:scale(1.08)}
.tab:active .ti{transform:scale(.94)}
:root{--t-learn:#2F6BFF;--t-talk:#16A765;--t-review:#F97316;--t-me:#7C5CFC;--t-words:#EC4899}


/* cards / lists */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}
.card h3{font-family:var(--display);font-size:19px;font-weight:400}
.sec{font-family:var(--display);font-size:20px;margin:24px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sc{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc:active{transform:translateY(2px);border-bottom-width:3px}
.sc .t{font-weight:800;font-size:16px}
.sc .e{color:var(--mute);font-size:13px}
.sc .stag{margin-top:8px;font-size:12px;font-weight:800;color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.chip:active{background:var(--brand-soft)}
input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}

/* buttons */
.btn{display:block;width:100%;background:var(--brand);color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:18px;border-bottom:5px solid var(--brand-d);text-align:center}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.ok{background:var(--ok);border-bottom-color:var(--ok-d);color:#fff}
.btn.bad{background:var(--bad);border-bottom-color:var(--bad-d)}
.btn.ghost{background:var(--surface);color:var(--brand);border:2px solid var(--line);border-bottom-width:5px}
.btn[disabled]{background:var(--line);color:var(--mute);border-bottom-color:var(--line);pointer-events:none}
.btn+.btn{margin-top:10px}
.mini{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--mute);background:var(--surface)}
.mini:active{background:var(--brand-soft)}

/* overlay screens */
#ov{position:fixed;inset:0;z-index:50;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.sh-top{display:flex;align-items:center;gap:12px;padding:12px 0}
.x{color:var(--mute);display:grid;place-items:center;width:36px;height:36px}
.pbar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.sh-body{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column}
.sh-foot{padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.q{font-family:var(--display);font-size:25px;line-height:1.3;margin:10px 0 18px}
.say{display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0 22px}
.spk{width:84px;height:84px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;border-bottom:6px solid var(--brand-d)}
.spk:active{transform:translateY(3px);border-bottom-width:3px}
.spk.sm{width:52px;height:52px;background:var(--brand-soft);color:var(--brand);border-bottom:4px solid var(--line)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:15px 16px;font-size:17px;font-weight:600;margin-bottom:10px}
.opt:active{background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{pointer-events:none}
.pc{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:24px 20px;text-align:center}
.pc .en{font-family:var(--display);font-size:30px;line-height:1.3}
.pc .ko{margin-top:10px;color:var(--mute);font-size:16px}
.pc .tip{margin-top:14px;background:var(--warn-soft);border-radius:14px;padding:10px 12px;font-size:14px;text-align:left}
.w{display:inline-block;padding:0 2px;border-radius:8px;transition:background .1s}
.w.on{background:var(--warn-soft);color:var(--ink)}
.w.g{color:var(--ok-d);background:var(--ok-soft)}
.w.r{color:var(--bad-d);background:var(--bad-soft);text-decoration:underline wavy}
.lab{font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.04em;margin-bottom:10px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;border-bottom:7px solid var(--bad-d);margin:8px auto}
.mic.rec{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.heard{min-height:24px;text-align:center;color:var(--mute);margin:4px 0 8px;font-size:15px}
.typed{display:flex;gap:8px;margin-top:6px}
.typed .btn{width:auto;flex:none;white-space:nowrap;padding:12px 20px;font-size:15px}
.fb{border-radius:24px 24px 0 0;margin:0 -16px;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:none}
.fb .in{max-width:560px;margin:0 auto}
.fb.ok{background:var(--ok-soft)}.fb.no{background:var(--bad-soft)}
.fb .h{font-family:var(--display);font-size:22px;margin-bottom:4px}
.fb.ok .h{color:var(--ok-d)}.fb.no .h{color:var(--bad-d)}
.fb .d{font-size:15px;margin-bottom:14px}
.big{font-family:var(--display);font-size:44px;line-height:1.1}
.center{text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin-top:18px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:24px;font-weight:400}
.tile span{font-size:12px;color:var(--mute);font-weight:700}
.ring{width:132px;height:132px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:38px}
.note{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;text-align:left;font-size:14px}
.note b{display:block;margin-bottom:2px}

/* chat */
.ct{flex:1;min-width:0}
.ct b{display:block;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct small{color:var(--mute);font-size:12px}
.fin{background:var(--ok);color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:99px;border-bottom:3px solid var(--ok-d)}
.tasks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tk{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;max-width:78%}
.tk .o{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.tk.d{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-d)}
.tk.d .o{background:var(--ok);border-color:var(--ok)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:6px 0 14px}
.rt{display:flex;gap:8px;align-items:flex-start}
.av{flex:none}
.tb{background:var(--surface);border:2px solid var(--line);border-radius:6px 20px 20px 20px;padding:12px 14px;max-width:calc(100% - 50px)}
.tb .en{font-size:17px;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pop{display:none;margin-top:10px;background:var(--warn-soft);border-radius:12px;padding:9px 11px;font-size:14px}
.pop.show{display:block}
.sample{display:block;margin-top:8px;font-weight:700;color:var(--brand);text-align:left;text-decoration:underline;text-underline-offset:3px}
.ru{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ub{background:var(--brand);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 15px;max-width:86%;font-size:17px;line-height:1.5}
.corr{max-width:92%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:11px 13px;font-size:14px}
.corr.good{background:var(--ok-soft);border-color:transparent;color:var(--ok-d);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.corr.good .nat{font-weight:500;color:var(--ink);width:100%}
.corr.fix{border-color:var(--warn)}
.corr .cl{font-size:12px;font-weight:800;color:var(--mute)}
.corr .cs{font-size:18px;font-weight:800;color:var(--ok-d);margin:2px 0 6px;line-height:1.4}
.corr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.corr li s{color:var(--bad-d)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:1px 7px;margin-right:6px;color:#fff;background:var(--bad)}
.tag.word{background:#F59E0B}.tag.unnatural{background:var(--brand)}.tag.pronunciation{background:#7C5CFC}
.corr .pt,.corr .nat{margin-top:8px}
.corr .cb{display:flex;gap:6px;margin-top:10px}
.cfoot{padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.cst{min-height:20px;font-size:13px;color:var(--mute);text-align:center;margin-bottom:6px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;border-radius:24px;padding:13px 16px;max-height:120px;resize:none}
.rbtn{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--brand);border-bottom:4px solid var(--brand-d)}
.rbtn.mc{background:var(--bad);border-bottom-color:var(--bad-d)}
.rbtn.mc.rec{animation:pulse 1.1s infinite}
.rbtn[disabled]{background:var(--line);border-bottom-color:var(--line);color:var(--mute)}
.dots{display:inline-flex;gap:5px;padding:4px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:dt 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{50%{opacity:.25}}
.err{background:var(--bad-soft);color:var(--bad-d);border-radius:14px;padding:10px 12px;font-size:14px}

/* review */
.rv{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}
.rv .tx{flex:1;min-width:0}
.rv .e{font-weight:700;font-size:16px;line-height:1.35}
.rv .k{font-size:13px;color:var(--mute)}
.dotz{display:flex;gap:4px;margin-top:6px}
.dotz i{width:18px;height:6px;border-radius:99px;background:var(--line)}
.dotz i.f{background:var(--ok)}
.empty{text-align:center;padding:34px 10px;color:var(--mute)}
.wk{display:flex;justify-content:space-between;margin-top:12px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mute)}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.wk i.on{background:var(--ok)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:2px solid var(--line)}
.row2:first-child{border-top:0}
.sw{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
input[type=range]{width:100%;accent-color:var(--brand)}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .s{width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto}
#sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:10px}
.lvrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 12px;margin-top:8px}
.lvrow.on{border-color:var(--brand);background:var(--brand-soft)}

function say(text,o={}){return new Promise(res=>{try{
  if(!('speechSynthesis' in window)){noVoice();return res()}
  const ss=speechSynthesis;
  let started=false,done=false,tries=0,wd=null;
  const fin=()=>{if(done)return;done=true;clearTimeout(wd);o.onWord&&o.onWord(-1);res()};
  try{if(ss.speaking||ss.pending)ss.cancel();ss.resume()}catch(e){}
  const go=useVoice=>{
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=o.rate||rateNow();u.volume=1;
    const v=useVoice?pickV():null;if(v)u.voice=v;
    if(o.onWord)u.onboundary=e=>o.onWord(e.charIndex);
    u.onstart=()=>{started=true;clearTimeout(wd);wd=setTimeout(()=>{try{ss.cancel()}catch(e){}fin()},Math.max(4000,text.length*160/(u.rate||1)+3000))};
    u.onend=fin;
    u.onerror=e=>{const er=e&&e.error;if(er==='canceled'||er==='interrupted'||started||tries>=2)return fin();tries++;setTimeout(()=>{try{go(false)}catch(x){fin()}},200)};
    ss.speak(u);
  };
  wd=setTimeout(()=>{if(!started){try{ss.cancel()}catch(e){}noVoice();fin()}},4500);
  setTimeout(()=>{try{go(true)}catch(e){fin()}},60);
}catch(e){res()}})}

const SRc=window.SpeechRecognition||window.webkitSpeechRecognition;
const Speech={dict:null,eng:null,rec:null,
  detect(){this.eng=this.dict?'dict':(SRc?'sr':null)},
  listen(onPart){return new Promise((resolve,reject)=>{
    if(this.eng==='dict'){
      const d=this.dict;let buf='';const offs=[];
      const done=()=>offs.forEach(f=>{try{f()}catch(e){}});
      offs.push(d.onPartial(e=>onPart&&onPart((buf+' '+(e.text||'')).trim())));
      offs.push(d.onFinal(e=>{buf+=e.text;onPart&&onPart(buf.trim());d.stop().catch(()=>{})}));
      offs.push(d.onState(e=>{if(e.state==='idle'){done();buf.trim()?resolve({text:buf.trim()}):reject({error:e.reason||'no-speech'})}}));
      d.start({language:'en'}).catch(err=>{done();reject({error:err.code||'error'})});
    }else if(this.eng==='sr'){
      const r=new SRc();r.lang='en-US';r.interimResults=true;r.maxAlternatives=3;let fin=null,err='';
      r.onresult=e=>{const R=e.results[e.results.length-1];if(R.isFinal)fin={text:R[0].transcript.trim(),conf:R[0].confidence};else onPart&&onPart(R[0].transcript)};
      r.onerror=e=>{err=e.error};
      r.onend=()=>{Speech.rec=null;fin&&fin.text?resolve(fin):reject({error:err||'no-speech'})};
      Speech.rec=r;try{r.start()}catch(e){reject({error:'error'})}
    }else reject({error:'unsupported'});
  })},
  stop(){try{if(this.eng==='dict')this.dict.stop();else this.rec&&this.rec.stop()}catch(e){}}
};

let cur=null;
function genSys(L,ui){const T=L.n>10,R=LV[P.level-1];return `You write lesson content for a Korean adult learning American English.
${T?`Special track "${L.name}". The student's general level is Level ${R.n} (CEFR ${R.cefr}): ${R.g} Adapt difficulty to that level. Track focus: ${L.g}`:`Level ${L.n} "${L.name}" (CEFR ${L.cefr}). Style: ${L.g}`}

Reply with ONLY JSON, no markdown:
{"ph":[{"en":"natural spoken American English sentence","ko":"자연스러운 한국어 뜻","tip":"한국어 한 줄 팁 (발음·쓰임)"}],"rp":{"scene":"one English sentence describing a roleplay scene for this topic","role":"who Emma plays, e.g. a barista","tasks":[{"en":"short task for the student","ko":"한국어"}]}}
Exactly 5 items in "ph" (complete sentences the student can say aloud, slightly harder each) and exactly 3 items in "tasks".`}
async function getUnit(li,ui){
  const b=BUILTIN[key(li,ui)];
  if(b)return{ph:b.ph.map(p=>({en:p[0],ko:p[1],tip:''})),rp:{scene:b.rp.scene,role:b.rp.role,tasks:b.rp.tasks.map(t=>({en:t[0],ko:t[1]}))}};
  const k='ee_u_'+li+'_'+ui,c=LS.get(k,null);if(c)return c;
  const raw=await AI.ask(genSys(LV[li-1],ui),[{role:'user',content:'Generate the unit now.'}],'quick');
  const j=parseJ(raw);
  if(!j||!Array.isArray(j.ph)||j.ph.length<3||!j.rp||!Array.isArray(j.rp.tasks))throw{code:'upstream_error'};
  j.ph=j.ph.slice(0,5).filter(p=>p&&p.en);j.rp.tasks=j.rp.tasks.slice(0,3);
  LS.set(k,j);return j;
}

function listenQ(i=0,ok=0,order){
  const ph=cur.u.ph;order=order||shuffle(ph.map((p,k)=>k));

  const p=ph[order[i]];
  const pool=[...ph.filter((_,k)=>k!==order[i]).map(x=>x.ko)];
  const extra=Object.values(BUILTIN).flatMap(b=>b.ph.map(x=>x[1])).filter(k=>k!==p.ko&&!pool.includes(k));
  const opts=shuffle([p.ko,...shuffle(pool).slice(0,2),...shuffle(extra).slice(0,3-Math.min(2,pool.length))].slice(0,4));
  cur.q={i,ok,order,p,opts,done:false};
  shell({prog:i/order.length,body:`<div class="q">들려주는 문장의 뜻은?</div><div class="say"><button class="spk" data-a="qplay" aria-label="듣기">${ic('speaker',38)}</button><button class="spk sm" data-a="qslow" style="font-weight:800;font-size:14px" aria-label="느리게">0.6x</button></div>${opts.map((o,k)=>`<button class="opt" data-a="qpick" data-k="${k}">${esc(o)}</button>`).join('')}`,foot:''});

const nw=s=>String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function cmp(target,heard){const pool=nw(heard);const res=target.split(/\s+/).map(w=>{const k=nw(w)[0];if(!k)return{w,ok:true};const i=pool.indexOf(k);if(i>=0){pool.splice(i,1);return{w,ok:true}}return{w,ok:false}});return{res,score:res.filter(r=>r.ok).length/res.length}}

let S=null;
function chatSys(){
  const L=LV[P.level-1],s=S;
  if(s.kind==='placement')return `You are "Emma", an American English teacher giving a friendly placement chat to a Korean adult learner to find their level (10 levels: 1 Pre-A1 ... 10 C2).
Start with a very easy question. After each answer adapt: if answers are easy and accurate, ask a slightly harder open question (past experiences, opinions, hypotheticals, abstract topics); if they struggle, simplify. Do NOT teach or correct. Be warm.
Reply with ONLY JSON: {"reply":"1-2 sentences ending with a question (in the FINAL turn thank them, no question)","reply_ko":"한국어 번역","hint_ko":"한 줄 힌트","sample_answer":"easy example answer","correction":{"has_issue":false},"tasks_done":[],"finished":false}
Messages include [turn k/${s.max}]. "[start]" means greet and ask the first question.`;
  return `You are "Emma", a warm American English conversation partner and teacher for an adult Korean learner.
Student level: Level ${L.n}/10 "${L.name}" (CEFR ${L.cefr}). Style for YOUR speech: ${L.g}
${s.kind==='free'?`Mode: free talk about "${s.topic}". Keep it natural; ask follow-up questions.`:`Mode: roleplay. Scene: ${s.scene} You play: ${s.role}. Stay in character and keep the scene realistic.`}
${s.tasks.length?`The student must accomplish these tasks during the conversation (0-based):\n${s.tasks.map((t,i)=>i+': '+t.en).join('\n')}\nSteer naturally so each task comes up. "tasks_done" lists ALL task indexes accomplished so far (cumulative). When all are done, close the scene warmly and set "finished" true.`:'Set "finished" true only in the final turn.'}
Reply with ONLY one JSON object (no markdown):
{"correction":{"has_issue":true|false,"corrected":"student's sentence fixed into natural American English","issues":[{"type":"grammar|word|unnatural|pronunciation","wrong":"...","right":"...","why_ko":"초등학교 3학년도 알 수 있는 쉬운 말 (35자 이내)","rule":"short-kebab-case id for this KIND of mistake; use the same id every time the same kind of mistake happens, e.g. be-verb-missing, article-a-an, past-tense, plural-s, preposition-in-on-at, word-order, th-sound, r-l-sound","rule_ko":"실수 종류 이름 (쉬운 말, 12자 이내)"}],"natural":"optional more native-like phrasing","pronunciation_tip_ko":"optional Korean tip"},"reply":"Emma's English reply","reply_ko":"한국어 번역","hint_ko":"한 줄 힌트","sample_answer":"easy example answer the student could say","tasks_done":[],"finished":false}
Rules:
- Correction strictness: Levels 1-3 fix only meaningful errors (max 1-2 issues) with very simple Korean. Levels 4-6 fix grammar and wrong words. Levels 7-8 also unnatural phrasing and collocations. Levels 9-10 also register, idioms and native-like rhythm.
- Student text comes from speech recognition or typing: ignore capitalization and punctuation.
- Pronunciation: flag only if the message shows low confidence (<0.85) or the transcript suggests a confusable word (light/right, think/sink, very/berry). Say "may have sounded like". Never invent problems.
- If the sentence is fine: has_issue=false and issues=[].
- Reply length: Levels 1-2 one short sentence; 3-5 one or two; 6-10 two or three. End with a question unless finished.
- "[start]" means: greet in character, set the scene, ask the first easy question; has_issue=false.
- Messages include [turn k/${s.max}]. In the FINAL turn wrap up in 1-2 sentences, no question, finished=true.`;
}

  if(!j||j.app!=='emma-english'||!j.data||typeof j.data!=='object'){toast('이 파일은 기록 파일이 아니에요');return}
  const keys=Object.keys(j.data).filter(k=>k.startsWith('ee_'));
  if(!keys.length){toast('기록이 비어 있어요');return}
  if(!await ask('지금 있는 기록이 이 파일의 기록으로 바뀌어요. 계속할까요?','불러오기'))return;
  const myKey=C.key;
  try{keys.forEach(k=>{let v=j.data[k];if(typeof v!=='string')return;if(k==='ee_c'){try{const o=JSON.parse(v);if(myKey)o.key=myKey;v=JSON.stringify(o)}catch(x){}}localStorage.setItem(k,v)})}catch(x){toast('저장 공간이 모자라서 불러오지 못했어요');return}
  toast('기록을 불러왔어요');setTimeout(()=>location.reload(),700);
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ================= auto cloud save (Claude link only) ================= */
const ES={on:false,at:0,db:null,id:null,last:{}};
const hsh=x=>{let h=0;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;return String(h)};
function esPayload(){let c={};try{c=JSON.parse(localStorage.getItem('ee_c')||'{}')}catch(e){}delete c.key;return{ee_p:localStorage.getItem('ee_p')||'',ee_c:JSON.stringify(c)}}
const isFresh=()=>!P.placed&&!(P.days&&P.days.length)&&!P.sent&&!P.lessons;
const esText=()=>ES.on?('자동 저장 켜짐'+(ES.at?' · '+new Date(ES.at).toLocaleTimeString('ko',{hour:'2-digit',minute:'2-digit'}):'')):'이 폰 안에는 자동으로 저장돼요';
function esShow(){const el=document.getElementById('es-st');if(el)el.textContent=esText()}
let esBusy=false,esTm=0;
async function esUp(){
  if(!ES.on||esBusy)return;esBusy=true;
  const pl=esPayload(),t=Date.now();
  try{
    for(const k of Object.keys(pl)){if(!pl[k]||ES.last[k]===pl[k])continue;await ES.db.doc('data/users/'+ES.id+'/'+k).set({v:pl[k],t});ES.last[k]=pl[k]}
    localStorage.setItem('es_t',String(t));localStorage.setItem('es_h',hsh(pl.ee_p));ES.at=t;esShow();
  }catch(e){}
  esBusy=false;
}
esSched=()=>{if(!ES.on)return;clearTimeout(esTm);esTm=setTimeout(esUp,3000)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ES.on)esUp()});
async function esInit(){
  try{
    if(!(window.claude&&claude.use))return;
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    ES.db=db;ES.id=id;
    const base='data/users/'+id+'/';
    const[rp,rc]=await Promise.all([db.doc(base+'ee_p').get(),db.doc(base+'ee_c').get()]);
    ES.on=true;
    const pl=esPayload(),lt=+localStorage.getItem('es_t')||0,lh=localStorage.getItem('es_h');
    const rem=rp.exists?rp.data():null,localChanged=lh!==hsh(pl.ee_p);
    const restore=rem&&rem.v&&(isFresh()||(lt&&rem.t>lt&&!localChanged));
    let reloaded=false;try{reloaded=!!sessionStorage.getItem('es_r')}catch(e){}
    if(restore&&rem.v!==pl.ee_p&&!reloaded){
      localStorage.setItem('ee_p',rem.v);
      if(rc.exists){try{const o=JSON.parse(rc.data().v),me=JSON.parse(localStorage.getItem('ee_c')||'{}');if(me.key!==undefined)o.key=me.key;localStorage.setItem('ee_c',JSON.stringify(o))}catch(e){}}
      localStorage.setItem('es_t',String(rem.t||Date.now()));localStorage.setItem('es_h',hsh(rem.v));
      try{sessionStorage.setItem('es_r','1')}catch(e){}
      location.reload();return;
    }
    if(rem){ES.last.ee_p=rem.v;ES.at=rem.t||0}
    if(rc.exists)ES.last.ee_c=rc.data().v;
    esShow();
    if(!isFresh())esUp();
  }catch(e){}
}

/* ================= boot ================= */
AI.init();
render();
esInit();
window.addEventListener('pageshow',()=>{loadV()});
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
